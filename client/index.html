    <script>
      // Immediately purge any stale Service Workers from previous localhost projects (e.g., NagrikSathi)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister().then(function(unregistered) {
              if (unregistered) {
                console.log('Successfully purged stale ServiceWorker from localhost');
              }
            });
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) {
            caches.delete(name);
          });
        });
      }
    </script>
