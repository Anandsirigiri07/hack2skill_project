name: LegalLens AI Automated Quality, Security & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Execute Full Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Server Dependencies
        run: npm ci || npm install
        working-directory: server

      - name: Install Client Dependencies
        run: npm ci || npm install
        working-directory: client

      - name: Start Backend Server in Isolated Mode
        run: |
          npm start &
          node -e "const check=()=>fetch('http://localhost:3001/api/health').then(()=>process.exit(0)).catch(()=>setTimeout(check,300));check();"
        working-directory: server
        env:
          PORT: 3001
          DEMO_MODE: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Backend Hardened Test Suite (49 assertions)
        run: npm test
        working-directory: server
        env:
          PORT: 3001
          DEMO_MODE: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Frontend Reliability & Precision Suite (38 assertions)
        run: npm test
        working-directory: client

      - name: Verify Client Build & Asset Efficiency
        run: npm run build
        working-directory: client
